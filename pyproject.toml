[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "searxng-mcp"
version = "2.3.7"
description = "SearXNG Search Engine MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.6.4,<0.7.0", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "scion-sdk[mcp]>=0.6.4,<0.7.0",]
all = [ "scion-sdk[mcp]>=0.6.4,<0.7.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
searxng-mcp = "searxng_mcp.mcp_server:mcp_server"
searxng-doctor = "searxng_mcp.doctor:main"

[project.entry-points."scion_sdk.prompt_providers"]
searxng-mcp = "searxng_mcp.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
searxng-mcp = "searxng_mcp:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
searxng_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**", "embedded/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv.extra-build-dependencies]
# The `searxng` git dependency (the [embedded] extra) uses a legacy setup.py
# that executes `searx/__init__.py` at build-metadata time — which calls
# init_settings() at MODULE level, pulling in most of searx's own runtime
# requirements.txt just to compute the package version/metadata, none of
# which it declares as a build dependency. Without this, `uv`'s isolated
# build environment can't even resolve the package (fails before its own
# requirements.txt is ever consulted). Upstream packaging quirk, not ours to
# fix; this is uv's own documented workaround — mirrors searx/requirements.txt.
searxng = [
    "certifi", "babel", "flask-babel", "flask", "jinja2", "lxml>=6.1.3", "pygments",
    "python-dateutil", "pyyaml", "httpx", "httpx-socks", "sniffio", "valkey",
    "markdown-it-py", "msgspec", "typer", "isodate", "whitenoise",
    "typing-extensions",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
